<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>OMNIA</title>
<style>
@font-face{font-family:Michroma;src:url(fonts/michroma-latin.woff2) format('woff2');font-display:swap}
@font-face{font-family:Inter;src:url(fonts/inter-latin.woff2) format('woff2');font-weight:100 900;font-display:swap}
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#02030a;color:#f2f4fb}
body{display:grid;place-items:center;text-align:center;padding:0 20px;font:300 14px/1.6 Inter,-apple-system,sans-serif}
.p{width:14px;height:14px;border-radius:50%;margin:0 auto 34px;background:#fff;box-shadow:0 0 30px 8px rgba(150,190,255,.55);animation:b 4s ease-in-out infinite}
@keyframes b{50%{box-shadow:0 0 50px 16px rgba(150,190,255,.35)}}
h1{margin:0 0 18px;font:400 clamp(28px,6vw,52px)/1 Michroma,sans-serif;letter-spacing:.3em;margin-right:-.3em}
p{margin:0;color:#8f97b8;font:400 10px/1.8 Michroma,sans-serif;letter-spacing:.36em}
</style>
</head>
<body><main><div class="p"></div><h1>OMNIA</h1><p>SOLO SU INVITO</p></main></body>
